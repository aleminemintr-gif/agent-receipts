<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-receipts</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--fg:#e6edf3;--mut:#8b98a8;--ok:#3fb950;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px}h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--mut);margin-bottom:24px}.card{background:var(--card);border-radius:10px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:16px;color:var(--acc)}input,select,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid #2b3340;background:#0e1116;color:var(--fg)}
input{width:100%;margin:4px 0 8px}button{background:var(--acc);color:#04111f;border:0;cursor:pointer;font-weight:600}
pre{background:#0b0e13;padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;margin:8px 0 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px}.ok{background:#12301b;color:var(--ok)}.bad{background:#3a1416;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}small{color:var(--mut)}
table{width:100%;border-collapse:collapse}td{padding:5px 4px;border-top:1px solid #222a35;font-size:13px}
</style></head><body><main>
<h1>agent-receipts</h1>
<div class="sub">An outside witness for AI agents. Say what you did, we check the world, you get a signed receipt.</div>
<div class="card"><h2>1. Account <small id="acct"></small></h2>
<button id="mk">Create account (free)</button> <small id="early"></small></div>
<div class="card"><h2>2. Verify a claim</h2>
<div class="row"><div><small>Check</small><br><select id="check"><option>http_status</option><option>http_contains</option><option>json_field</option><option>content_hash</option><option>dns_record</option></select></div>
<div><small>Claim (what the agent says it did)</small><input id="claim" value="I deployed the page"></div></div>
<small>Params (JSON)</small><input id="params" value='{"url":"https://example.com","expect_status":200}'>
<button id="go">Get signed receipt</button><div id="out"></div></div>
<div class="card"><h2>Recent receipts</h2><table id="recent"></table></div>
</main><script>
let key=localStorage.ar_key||'';const $=i=>document.getElementById(i);
async function j(p,o){const r=await fetch(p,o);return r.json()}
async function refresh(){const i=await j('/v1/info');$('early').textContent=`Early program: ${i.early_program.taken}/${i.early_program.limit} taken, ${i.early_program.points_each} points each (credits for receipts, not a token).`;
if(key){const m=await j('/v1/me',{headers:{authorization:'Bearer '+key}});if(m.id)$('acct').textContent=`${m.id} | free today: ${m.free_left_today} | points: ${m.points}`}
const r=await j('/v1/recent');$('recent').innerHTML=r.receipts.map(x=>`<tr><td><span class="pill ${x.passed?'ok':'bad'}">${x.passed?'PASS':'FAIL'}</span></td><td>${x.check}</td><td>${x.claim.replace(/</g,'&lt;')}</td><td><small>${x.id}</small></td></tr>`).join('')}
$('mk').onclick=async()=>{const r=await j('/v1/accounts',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});key=r.api_key;localStorage.ar_key=key;refresh()};
$('go').onclick=async()=>{let params;try{params=JSON.parse($('params').value)}catch{return $('out').textContent='params is not valid JSON'}
const r=await j('/v1/verify',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify({check:$('check').value,claim:$('claim').value,params})});
if(r.error){$('out').innerHTML=`<pre>${r.error}</pre>`;return}const x=r.receipt;
$('out').innerHTML=`<p><span class="pill ${x.passed?'ok':'bad'}">${x.passed?'PASS':'FAIL'}</span> <small>signed by key ${x.kid}, paid with ${x.paid_with}</small></p><pre>${JSON.stringify(x,null,2).replace(/</g,'&lt;')}</pre>`;refresh()};
refresh();
</script></body></html>
